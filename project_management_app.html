<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--bg4:#2a2f47;
    --border:#2e3450;--border2:#3a4060;
    --text:#e8eaf6;--text2:#8892b0;--text3:#4a5280;
    --accent:#6c63ff;--accent2:#5a52e0;--accent-dim:#2d2a5e;
    --green:#22c55e;--green-dim:#0f2a1a;
    --amber:#f59e0b;--amber-dim:#2a1f08;
    --red:#ef4444;--red-dim:#2a0f0f;
    --blue:#3b82f6;--blue-dim:#0f1e3a;
    --purple:#a855f7;--purple-dim:#2a1040;
    --radius:10px;--radius2:14px;
    font-family:'Segoe UI',system-ui,sans-serif;
  }
  body{background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
  input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:9px 12px;font-size:13px;width:100%;outline:none;transition:.15s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:80px}
  button{cursor:pointer;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;padding:9px 18px;transition:.15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent2)}
  .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg3);color:var(--text)}
  .btn-danger{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}
  .btn-danger:hover{background:var(--red);color:#fff}
  .btn-sm{padding:5px 12px;font-size:12px}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
  .badge-todo{background:#1e2235;color:var(--text2)}
  .badge-inprogress{background:var(--blue-dim);color:var(--blue)}
  .badge-done{background:var(--green-dim);color:var(--green)}
  .badge-overdue{background:var(--red-dim);color:var(--red)}
  .badge-admin{background:var(--purple-dim);color:var(--purple)}
  .badge-member{background:var(--accent-dim);color:var(--accent)}
  .badge-high{background:var(--red-dim);color:var(--red)}
  .badge-medium{background:var(--amber-dim);color:var(--amber)}
  .badge-low{background:var(--green-dim);color:var(--green)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
  .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
  .modal h3{font-size:18px;font-weight:600;margin-bottom:20px;color:var(--text)}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #app{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .sidebar-logo{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
  .logo-text{font-weight:700;font-size:15px;color:var(--text)}
  .sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
  .nav-section{margin-bottom:4px}
  .nav-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:8px 10px 4px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text2);cursor:pointer;transition:.15s;font-size:13px;font-weight:500}
  .nav-item:hover{background:var(--bg3);color:var(--text)}
  .nav-item.active{background:var(--accent-dim);color:var(--accent)}
  .nav-item .icon{font-size:15px;width:18px;text-align:center}
  .sidebar-user{padding:12px;border-top:1px solid var(--border)}
  .user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.15s}
  .user-pill:hover{background:var(--bg3)}
  .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{padding:0 28px;height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .topbar h1{font-size:20px;font-weight:700;color:var(--text)}
  .content{flex:1;overflow-y:auto;padding:28px}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;position:relative;overflow:hidden}
  .stat-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;opacity:.06;transform:translate(20px,-20px)}
  .stat-card.blue::before{background:var(--blue)}
  .stat-card.green::before{background:var(--green)}
  .stat-card.amber::before{background:var(--amber)}
  .stat-card.red::before{background:var(--red)}
  .stat-num{font-size:32px;font-weight:700;line-height:1;margin-bottom:4px}
  .stat-label{font-size:12px;color:var(--text2);font-weight:500}
  .stat-icon{font-size:22px;margin-bottom:10px}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .section-header h2{font-size:16px;font-weight:600}
  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .project-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;cursor:pointer;transition:.2s}
  .project-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .project-card h3{font-size:15px;font-weight:600;margin-bottom:6px}
  .project-card p{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5}
  .progress-bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:8px}
  .progress-fill{height:100%;border-radius:3px;background:var(--accent);transition:.3s}
  .project-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text2)}
  .member-stack{display:flex}
  .member-avatar{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-left:-6px}
  .member-avatar:first-child{margin-left:0}
  .tasks-list{display:flex;flex-direction:column;gap:10px}
  .task-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
  .task-row:hover{border-color:var(--border2)}
  .task-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.15s}
  .task-check.done{background:var(--green);border-color:var(--green);color:#fff}
  .task-title{flex:1;font-size:13px;font-weight:500}
  .task-title.done{text-decoration:line-through;color:var(--text2)}
  .task-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .task-due{font-size:11px;color:var(--text2)}
  .task-due.overdue{color:var(--red)}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .kanban-col{background:var(--bg3);border-radius:var(--radius2);padding:16px}
  .kanban-col-header{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .kanban-count{background:var(--bg4);border-radius:20px;padding:2px 8px;font-size:11px}
  .kanban-task{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
  .kanban-task:hover{border-color:var(--border2)}
  .kanban-task h4{font-size:13px;font-weight:500;margin-bottom:8px}
  .kanban-task p{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.5}
  .team-table{width:100%;border-collapse:collapse}
  .team-table th{text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:10px 16px;border-bottom:1px solid var(--border)}
  .team-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px}
  .team-table tr:last-child td{border-bottom:none}
  .auth-screen{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:420px;max-width:95vw}
  .auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
  .auth-logo .logo-icon{width:44px;height:44px;font-size:18px}
  .auth-logo .logo-text{font-size:20px;font-weight:700}
  .auth-tabs{display:flex;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:24px}
  .auth-tab{flex:1;padding:8px;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:.15s}
  .auth-tab.active{background:var(--accent);color:#fff}
  .color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .tag{display:inline-block;background:var(--bg4);color:var(--text2);border-radius:6px;padding:2px 8px;font-size:11px;margin:2px}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
  .empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.4}
  .empty-state p{font-size:14px;line-height:1.6}
  .dropdown-menu{position:absolute;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:6px;min-width:160px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .dropdown-item{padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text)}
  .dropdown-item:hover{background:var(--bg3)}
  .dropdown-item.danger{color:var(--red)}
  .dropdown-item.danger:hover{background:var(--red-dim)}
  .notif{position:fixed;top:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:14px 18px;font-size:13px;z-index:2000;display:flex;align-items:center;gap:10px;animation:slideIn .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.4)}
  @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  .color-bar{height:3px;border-radius:0 0 0 0;margin:-20px -20px 16px}
  .no-select{user-select:none}
  .flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.justify-between{justify-content:space-between}.flex-wrap{flex-wrap:wrap}
  .mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
  .text-sm{font-size:12px}.text-xs{font-size:11px}.text-muted{color:var(--text2)}
  .w-full{width:100%}.mb-4{margin-bottom:16px}.mb-3{margin-bottom:12px}
  select option{background:var(--bg2)}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const COLORS=['#6c63ff','#3b82f6','#22c55e','#f59e0b','#ef4444','#a855f7','#14b8a6','#f97316'];
function getInitials(name){return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function getColor(str){let h=0;for(let c of str)h=c.charCodeAt(0)+h*31;return COLORS[Math.abs(h)%COLORS.length];}
function today(){return new Date().toISOString().split('T')[0];}
function isOverdue(due,status){return due&&due<today()&&status!=='done';}
function fmtDate(d){if(!d)return'';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

const DB={
  get(k){try{return JSON.parse(localStorage.getItem('pm_'+k)||'null');}catch{return null;}},
  set(k,v){localStorage.setItem('pm_'+k,JSON.stringify(v));}
};

function initData(){
  if(!DB.get('users')){
    const users=[
      {id:'u1',name:'Alex Johnson',email:'admin@demo.com',password:'admin123',role:'admin',joinedAt:today()},
      {id:'u2',name:'Sarah Chen',email:'sarah@demo.com',password:'member123',role:'member',joinedAt:today()},
      {id:'u3',name:'Marcus Lee',email:'marcus@demo.com',password:'member123',role:'member',joinedAt:today()},
    ];
    DB.set('users',users);
    const projects=[
      {id:'p1',name:'Website Redesign',desc:'Revamp the company website with modern design and better UX.',color:'#6c63ff',owner:'u1',members:['u1','u2','u3'],createdAt:today()},
      {id:'p2',name:'Mobile App MVP',desc:'Build the first version of our cross-platform mobile application.',color:'#3b82f6',owner:'u2',members:['u1','u2'],createdAt:today()},
      {id:'p3',name:'API Integration',desc:'Integrate third-party payment and analytics APIs.',color:'#22c55e',owner:'u1',members:['u1','u3'],createdAt:today()},
    ];
    DB.set('projects',projects);
    const tasks=[
      {id:'t1',title:'Design system setup',desc:'Create reusable component library and design tokens.',project:'p1',assignee:'u2',priority:'high',status:'done',due:'2025-05-10',createdBy:'u1',createdAt:today()},
      {id:'t2',title:'Homepage layout',desc:'Build responsive homepage with hero section.',project:'p1',assignee:'u2',priority:'high',status:'inprogress',due:'2025-05-20',createdBy:'u1',createdAt:today()},
      {id:'t3',title:'Navigation menu',desc:'Implement sticky nav with mobile hamburger.',project:'p1',assignee:'u3',priority:'medium',status:'todo',due:'2025-05-25',createdBy:'u1',createdAt:today()},
      {id:'t4',title:'Authentication flow',desc:'Build login, signup, and password reset screens.',project:'p2',assignee:'u2',priority:'high',status:'inprogress',due:'2025-05-15',createdBy:'u2',createdAt:today()},
      {id:'t5',title:'Push notifications',desc:'Integrate FCM for iOS and Android notifications.',project:'p2',assignee:'u1',priority:'medium',status:'todo',due:'2025-06-01',createdBy:'u2',createdAt:today()},
      {id:'t6',title:'Stripe integration',desc:'Set up Stripe checkout and webhook handling.',project:'p3',assignee:'u3',priority:'high',status:'todo',due:'2025-04-30',createdBy:'u1',createdAt:today()},
      {id:'t7',title:'Analytics dashboard',desc:'Connect Mixpanel and build event tracking.',project:'p3',assignee:'u1',priority:'low',status:'done',due:'2025-05-05',createdBy:'u1',createdAt:today()},
    ];
    DB.set('tasks',tasks);
  }
}

initData();

let state={
  currentUser:DB.get('session'),
  page:'dashboard',
  activeProject:null,
  modals:{},
  projectFilter:'all',
  taskFilter:'all',
};

function setState(updates){
  Object.assign(state,updates);
  render();
}

function getUsers(){return DB.get('users')||[];}
function getProjects(){return DB.get('projects')||[];}
function getTasks(){return DB.get('tasks')||[];}

function getMyProjects(){
  const u=state.currentUser;
  if(!u)return[];
  return getProjects().filter(p=>p.members.includes(u.id)||(u.role==='admin'));
}

function getMyTasks(){
  const u=state.currentUser;
  if(!u)return[];
  const myProjs=getMyProjects().map(p=>p.id);
  return getTasks().filter(t=>myProjs.includes(t.project));
}

function showNotif(msg,type='success'){
  const el=document.createElement('div');
  el.className='notif';
  el.innerHTML=`<span style="font-size:16px">${type==='success'?'✓':type==='error'?'✕':'ℹ'}</span><span>${msg}</span>`;
  el.style.borderLeft=`3px solid ${type==='success'?'var(--green)':type==='error'?'var(--red)':'var(--accent)'}`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function login(email,password){
  const users=getUsers();
  const user=users.find(u=>u.email===email&&u.password===password);
  if(!user){showNotif('Invalid credentials','error');return;}
  DB.set('session',user);
  setState({currentUser:user,page:'dashboard'});
  showNotif(`Welcome back, ${user.name.split(' ')[0]}!`);
}

function signup(name,email,password,role){
  const users=getUsers();
  if(users.find(u=>u.email===email)){showNotif('Email already registered','error');return;}
  const newUser={id:'u'+Date.now(),name,email,password,role:'member',joinedAt:today()};
  users.push(newUser);
  DB.set('users',users);
  DB.set('session',newUser);
  setState({currentUser:newUser,page:'dashboard'});
  showNotif(`Account created! Welcome, ${name.split(' ')[0]}!`);
}

function logout(){
  DB.set('session',null);
  setState({currentUser:null,page:'dashboard'});
}

function createProject(data){
  const projects=getProjects();
  const p={id:'p'+Date.now(),...data,owner:state.currentUser.id,members:[state.currentUser.id,...(data.members||[])],createdAt:today()};
  projects.push(p);
  DB.set('projects',projects);
  setState({modals:{}});
  showNotif('Project created!');
}

function deleteProject(pid){
  if(!confirm('Delete this project and all its tasks?'))return;
  const projects=getProjects().filter(p=>p.id!==pid);
  const tasks=getTasks().filter(t=>t.project!==pid);
  DB.set('projects',projects);
  DB.set('tasks',tasks);
  setState({page:'projects',activeProject:null});
  showNotif('Project deleted');
}

function createTask(data){
  const tasks=getTasks();
  const t={id:'t'+Date.now(),...data,createdBy:state.currentUser.id,createdAt:today()};
  tasks.push(t);
  DB.set('tasks',tasks);
  setState({modals:{}});
  showNotif('Task created!');
}

function updateTaskStatus(tid,status){
  const tasks=getTasks().map(t=>t.id===tid?{...t,status}:t);
  DB.set('tasks',tasks);
  setState({});
}

function deleteTask(tid){
  const tasks=getTasks().filter(t=>t.id!==tid);
  DB.set('tasks',tasks);
  setState({});
  showNotif('Task deleted');
}

function addMember(uid,pid){
  const projects=getProjects().map(p=>p.id===pid?{...p,members:[...new Set([...p.members,uid])]}:p);
  DB.set('projects',projects);
  setState({modals:{}});
  showNotif('Member added!');
}

function removeProjectMember(uid,pid){
  const p=getProjects().find(x=>x.id===pid);
  if(p.owner===uid){showNotif("Can't remove the project owner",'error');return;}
  const projects=getProjects().map(x=>x.id===pid?{...x,members:x.members.filter(m=>m!==uid)}:x);
  DB.set('projects',projects);
  setState({});
  showNotif('Member removed');
}

function Avatar({userId,size=28}){
  const users=getUsers();
  const u=users.find(x=>x.id===userId)||{name:'?',email:''};
  const bg=getColor(u.name);
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${bg}20;color:${bg};font-size:${size<24?9:11}px">${getInitials(u.name)}</div>`;
}

function renderAuth(){
  return `<div class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">PM</div>
        <div class="logo-text">ProjectFlow</div>
      </div>
      <div class="auth-tabs no-select">
        <div class="auth-tab ${state.authTab!=='signup'?'active':''}" onclick="setState({authTab:'login'})">Sign in</div>
        <div class="auth-tab ${state.authTab==='signup'?'active':''}" onclick="setState({authTab:'signup'})">Create account</div>
      </div>
      ${state.authTab==='signup'?`
        <div class="form-group"><label>Full Name</label><input id="a-name" type="text" placeholder="Your name"></div>
        <div class="form-group"><label>Email</label><input id="a-email" type="email" placeholder="you@example.com"></div>
        <div class="form-group"><label>Password</label><input id="a-pass" type="password" placeholder="Min 6 characters"></div>
        <button class="btn-primary w-full" style="margin-top:8px" onclick="handleSignup()">Create Account</button>
        <p style="font-size:12px;color:var(--text2);text-align:center;margin-top:16px">All new accounts are created as <strong style="color:var(--text)">Member</strong> role</p>
      `:`
        <div class="form-group"><label>Email</label><input id="a-email" type="email" placeholder="you@example.com" value="admin@demo.com"></div>
        <div class="form-group"><label>Password</label><input id="a-pass" type="password" placeholder="Password" value="admin123"></div>
        <button class="btn-primary w-full" style="margin-top:8px" onclick="handleLogin()">Sign In</button>
        <div style="margin-top:20px;padding:16px;background:var(--bg3);border-radius:10px;border:1px solid var(--border)">
          <p style="font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Demo Accounts</p>
          <div style="font-size:12px;display:flex;flex-direction:column;gap:6px">
            <div class="flex items-center gap-2"><span class="badge badge-admin">Admin</span><span style="color:var(--text2)">admin@demo.com / admin123</span></div>
            <div class="flex items-center gap-2"><span class="badge badge-member">Member</span><span style="color:var(--text2)">sarah@demo.com / member123</span></div>

function handleLogin(){
  const email=document.getElementById('a-email')?.value;
  const pass=document.getElementById('a-pass')?.value;

}
function handleSignup(){
  const name=document.getElementById('a-name')?.value;
  const email=document.getElementById('a-email')?.value;
  const pass=document.getElementById('a-pass')?.value;
  if(!name||!email||!pass){showNotif('All fields required','error');return;}

}

          <div class="form-group"><label>Status</label>
            <select id="ts">
              <option value="${state.prefillStatus||'todo'}">To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2 mt-4" style="justify-content:flex-end">
          <button class="btn-ghost" onclick="setState({modals:{}})">Cancel</button>
          <button class="btn-primary" onclick="handleCreateTask('${pid}')">Create Task</button>
        </div>
      </div>
    </div>`;
  }
  if(m.addMember){
    const pid=m.addMember;
    const proj=getProjects().find(p=>p.id===pid);
    const available=getUsers().filter(u=>!proj?.members.includes(u.id));
    return `<div class="modal-overlay" onclick="if(event.target===this)setState({modals:{}})">
      <div class="modal">
        <h3>Add Team Member</h3>
        ${available.length?`<div class="form-group"><label>Select Member</label>
          <select id="am">
            ${available.map(u=>`<option value="${u.id}">${u.name} (${u.role})</option>`).join('')}
          </select>
        </div>
        <div class="flex gap-2 mt-4" style="justify-content:flex-end">
          <button class="btn-ghost" onclick="setState({modals:{}})">Cancel</button>
          <button class="btn-primary" onclick="addMember(document.getElementById('am').value,'${pid}')">Add Member</button>
        </div>`:
        `<p class="text-muted" style="text-align:center;padding:20px">All users are already in this project</p>
        <div style="text-align:center;margin-top:16px"><button class="btn-ghost" onclick="setState({modals:{}})">Close</button></div>`}
      </div>
    </div>`;
  }
  return '';
}

function handleCreateProject(){
  const name=document.getElementById('pn')?.value?.trim();
  const desc=document.getElementById('pd')?.value?.trim();
  if(!name){showNotif('Project name required','error');return;}
  createProject({name,desc,color:state._pcolor||COLORS[0]});
}

function handleCreateTask(pid){
  const title=document.getElementById('tt')?.value?.trim();
  if(!title){showNotif('Task title required','error');return;}
  createTask({
    title,
    desc:document.getElementById('td')?.value?.trim(),
    project:pid,
    assignee:document.getElementById('ta')?.value||null,
    priority:document.getElementById('tp')?.value||'medium',
    due:document.getElementById('tdue')?.value||null,
    status:document.getElementById('ts')?.value||'todo',
  });
}

function renderContent(){
  switch(state.page){
    case'dashboard':return renderDashboard();
    case'projects':return renderProjects();
    case'project':return renderProject();
    case'tasks':return renderTasks();
    case'team':return renderTeam();
    default:return renderDashboard();
  }
}

const pageTitles={dashboard:'Dashboard',projects:'Projects',project:()=>{const p=getProjects().find(x=>x.id===state.activeProject);return p?.name||'Project';},tasks:'My Tasks',team:'Team Management'};

function render(){
  const root=document.getElementById('root');
  if(!state.currentUser){
    root.innerHTML=renderAuth();
    return;
  }
  const title=typeof pageTitles[state.page]==='function'?pageTitles[state.page]():pageTitles[state.page]||'';
  root.innerHTML=`<div id="app">
    ${renderSidebar()}
    <div class="main">
      <div class="topbar">
        <h1>${title}</h1>
        <div class="flex items-center gap-2">
          ${state.currentUser.role==='admin'?`<span class="badge badge-admin">Admin</span>`:`<span class="badge badge-member">Member</span>`}
        </div>
      </div>
      <div class="content">${renderContent()}</div>
    </div>
    ${renderModal()}
  </div>`;
}

render();
</script>
</body>
</html>
